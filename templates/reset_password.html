<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | SafeVision AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<meta name="csrf-token" content="{{ csrf_token() }}">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;margin:0}
.input-field{background-color:#1e293b;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:10px;font-size:.95rem;outline:none;box-sizing:border-box;width:100%}
.input-field:focus{border-color:#0284c7}
</style>
</head><body>

<div class="card" style="width:380px;background:#1e293b;padding:30px;border-radius:12px;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 25px rgba(0,0,0,.5)">
<h2 style="text-align:center;margin-bottom:8px;color:#fff">🛡️ SafeVision AI</h2>
<p style="text-align:center;color:#9ca3af;margin-bottom:25px;font-size:.9rem">Reset your password</p>

{% if not valid %}
<p style="color:#ef4444;text-align:center">This reset link is invalid or has expired. Please request a new one from the login screen.</p>
<p style="text-align:center;margin-top:15px"><a href="{{ url_for('index') }}" style="color:#0284c7">← Back to login</a></p>
{% else %}
<form id="resetForm">
<div style="margin-bottom:15px">
  <label style="display:block;margin-bottom:5px;color:#e5e7eb;font-size:.85rem">New Password</label>
  <input type="password" id="newPassword" class="input-field" placeholder="Min. 6 characters" required>
</div>
<div style="margin-bottom:20px">
  <label style="display:block;margin-bottom:5px;color:#e5e7eb;font-size:.85rem">Confirm New Password</label>
  <input type="password" id="confirmPassword" class="input-field" placeholder="Re-enter new password" required>
</div>
<button type="submit" class="btn-primary" style="width:100%;padding:12px;border-radius:6px;background-color:#0284c7;color:#fff;border:none;font-weight:bold;cursor:pointer">🔐 Update Password</button>
</form>
<p id="resetMessage" style="text-align:center;margin-top:15px;font-size:.85rem;display:none"></p>
{% endif %}
</div>

<script>
const form = document.getElementById("resetForm");
if (form) {
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const msgEl = document.getElementById("resetMessage");

        if (newPassword !== confirmPassword) {
            msgEl.style.color = "#ef4444";
            msgEl.innerText = "Passwords do not match.";
            msgEl.style.display = "block";
            return;
        }

        try {
            const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
            const res = await fetch("/api/reset_password", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken },
                body: JSON.stringify({ token: "{{ token }}", password: newPassword }),
            });
            const data = await res.json();

            msgEl.style.color = (res.ok && data.status === "success") ? "#22c55e" : "#ef4444";
            msgEl.innerText = data.message;
            msgEl.style.display = "block";

            if (res.ok && data.status === "success") {
                form.reset();
                setTimeout(() => { window.location.href = "/"; }, 1800);
            }
        } catch (err) {
            msgEl.style.color = "#ef4444";
            msgEl.innerText = "Something went wrong. Please try again.";
            msgEl.style.display = "block";
        }
    });
}
</script>
</body></html>
